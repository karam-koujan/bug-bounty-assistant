name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: file:./test.db
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test

      - name: Security verification — localhost-only binding
        run: |
          node_modules/.bin/next start -H 127.0.0.1 -p 3111 &
          sleep 6
          if curl -sf http://$(hostname -I | awk '{print $1}'):3111 > /dev/null 2>&1; then
            echo "ERROR: app is reachable on a non-localhost interface"; exit 1
          fi
          curl -sf http://127.0.0.1:3111/ > /dev/null || { echo "FAIL: app not reachable on localhost"; exit 1; }
          echo "✓ bound to 127.0.0.1 only"
      - name: Dependency audit (high/critical)
        run: npm audit --audit-level=high
        continue-on-error: false
